# Daily overwrite of shared rate_explorer_cache in Supabase (~07:00 CET).
# 06:00 UTC ≈ 07:00 CET (winter) / 08:00 CEST (summer).
name: Refresh Rate Explorer cache

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-rate-explorer-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Scrape + UPSERT Supabase Rate Explorer cache
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/seed-rate-explorer-cache.mjs
